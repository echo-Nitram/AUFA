version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aufa-db
    environment:
      POSTGRES_USER: aufa
      POSTGRES_PASSWORD: aufa_secret
      POSTGRES_DB: aufa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aufa-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
